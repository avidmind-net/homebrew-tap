name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

  # No Formula/ directory yet — re-add a `formulae` job (see git history)
  # if this tap ever ships a CLI formula alongside its casks.

  casks:
    # brew test-bot has no cask support (Homebrew/discussions#6499), so
    # casks are linted directly with brew style/audit instead. Needs a
    # macOS runner since --online audit checks for a working `curl` HEAD
    # against the download URL and cask syntax assumes macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Register this checkout as the avidmind-net/tap tap
        # brew style/audit refuse to load a cask that isn't inside a
        # recognized tap directory ("Homebrew requires casks to be in a
        # tap, rejecting: ..."), and a plain actions/checkout under
        # $GITHUB_WORKSPACE doesn't count. Symlinking the checkout into
        # Homebrew's Taps path makes it look like an installed tap.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/avidmind-net/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          echo "TAP_DIR=$tap_dir" >> "$GITHUB_ENV"

      - name: Style & audit changed casks
        run: |
          shopt -s nullglob
          casks=("$TAP_DIR"/Casks/*.rb)
          if [ ${#casks[@]} -eq 0 ]; then
            echo "No casks yet, nothing to lint."
            exit 0
          fi
          brew style --cask "${casks[@]}"
          brew audit --cask --online "${casks[@]}"
